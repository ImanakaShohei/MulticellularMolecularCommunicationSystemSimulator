cell:
    cell_seed: 0 # cellの位置などを設定する際に用いるシード値
    cell_num: 1000 # cellの初期個数。TODO: 複数種類の細胞に対応する。細胞数を増やすとやたら重くなる。理由を調べる
    position_update_method: EULER # AB4, AB3, AB2, EULER から選択

optimization:
    peformance: Fast # FAST, LOW-MEMORY から選択

simulation:
    sim_step: 1000 # シミュレーションの総ステップ数
    output_interval: 5 # 出力間隔
    field_x_len: 1024 # シミュレーションフィールドのx座標の長さ
    field_y_len: 1024 # シミュレーションフィールドのy座標の長さ
    field_z_len: 0 # シミュレーションフィールドのz座標の長さ
    delta_time: 0.1 # 1ステップあたりのシミュレーション内時間
    lambda: 30.0 # 力が届く範囲を決める値
    cell_growth: true # 細胞の成長・分裂
    simulation_type: CF # CF(ClusterFormationModel), NF(NetworkFormationModel), MG(MassGrowthModel), MR(MassRotationModel), SMD(SignalMoleculeDiffusionModel), US(UserSimulationModel)から選択
    algorithm_type: CELL-LIST # NAIVE, CELL-LIST, BARNES-HUT, USER から選択
    use_cluster_model: false # シミュレーションでクラスタモデルを使うかどうか
    
simulation_model:

    # 細胞塊成長モデル固有のパラメータ
    mass_glowth_model:
        adhesion_threshold: 3 # 接着している細胞の数がこの値以下の時に反発力が働く
        coefficient_cd: 10.0 # 反発力にかける係数
        contact_distance: 20.0 # 細胞同士がこの値より近づくと反発力が発生
        follower_attraction_factor: 2.0 # 接着している細胞の数がadhesion_thresholdより多い時に受ける引力にかける係数
        global_attraction_factor: 0.05 # すべての細胞間にかかる力の係数
        initial_radius: 150.0 # 細胞塊の初期半径
        leader_repulsion_factor: 2.0 # 接着している細胞の数がadhesion_threshold以下の時に受ける反発力にかける係数
        leader_repulsion_max_distance: 150.0 # リーダーに届く反発力の最大距離
        leader_repulsion_min_distance: 80.0 # リーダーに届く反発力の最小距離


    # ネットワーク形成モデル固有のパラメータ
    network_formation_model:
        max_attraction_distance: 100 # 引力が届く最大距離
        min_attraction_distance: 40 # 引力が働く最小距離
        max_repulsion_distance:  20 # 斥力が働く最大距離
        coefficient:             10 # 力に掛ける係数

    # 信号分子拡散モデル固有のパラメータ
    signal_molecule_diffusion_model:
        diffusion_coefficient: 1.0 # 拡散係数
        hydrolysis_coefficient: 0.1 # 加水分解係数

cell_algorithm:
    # CellList固有のパラメータ
    cell_list:
        grid_size_mag: 32 # cell listにおけるグリッドの分割倍率。最小は1、値は2^nである必要がある。
        search_radius: 64 # この半径内(positionの差)にあるcellを力の計算対象とする。

molecule:
    default_molecule_nums: # 各分子の初期個数(リストで表現する)
        - 3000
    delta_time: 0.001
    field_x_len: 200 # 分子管理用フィールドのx座標の長さ >= 1
    field_y_len: 200 # 分子管理用フィールドのy座標の長さ >= 1
    field_z_len: 1 # 分子管理用フィールドのz座標の長さ >= 1

    #
    #                   xy2
    #                   /
    #                  /
    #  yz1   +-------------------+
    #   \   /                   /|
    #    \ /                   / |
    #     /        zx2        /  |
    #    /                   /   |
    #   /                   /    |
    #  +-------------------+ yz2 +
    #  |                   |    /
    #  |                   |   /
    #  |        xy1        |  /
    #  |                   | /
    #  |                   |/
    #  +-------------------+
    #           |
    #           |
    #          zx1

    # TODO: 実装内で利用していないので、使うようにする
    boundary_condition: # 分子管理用フィールドの境界条件
        xy1: NEUMANN
        xy2: NEUMANN
        yz1: NEUMANN
        yz2: NEUMANN
        zx1: NEUMANN
        zx2: NEUMANN

